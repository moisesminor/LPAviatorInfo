<!doctype html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Aviator Info</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>
	<body class="m-0 min-h-screen bg-gradient-to-b from-[#021025] to-[#071028] font-sans text-white/85">
	<main class="flex min-h-screen items-center justify-center px-5 py-12">
		<section class="grid w-full max-w-[1100px] items-center gap-7 rounded-[14px] bg-gradient-to-b from-white/[0.02] to-transparent p-7 lg:grid-cols-[1fr_520px]" aria-labelledby="home-title">
			<div>
				<h1 id="home-title" class="mb-2 text-[32px] font-bold tracking-[0.4px] text-white sm:text-5xl">Aviator Info</h1>
				<p class="mb-[18px] text-lg leading-[1.5] text-white/90">Informações sobre modelos de aeronaves: especificações, história e curiosidades para entusiastas e profissionais da aviação.</p>
				<a class="inline-block rounded-[10px] bg-[#1fb6ff] px-4 py-2.5 font-semibold text-[#042033]" href="#">Explorar modelos</a>
			</div>

			<aside class="grid grid-cols-2 gap-3" aria-hidden="false">
				<img src="https://source.unsplash.com/1200x800/?airbus%20a320" alt="Airbus A320 em voo" class="col-span-2 h-[140px] w-full rounded-[10px] border border-white/[0.03] object-cover shadow-[0_8px_20px_rgba(2,6,23,0.6)] sm:h-[300px]">
				<img src="https://source.unsplash.com/800x600/?boeing%20737%20max" alt="Boeing 737 MAX-8 em voo" class="h-[140px] w-full rounded-[10px] border border-white/[0.03] object-cover shadow-[0_8px_20px_rgba(2,6,23,0.6)] sm:h-[170px]">
				<img src="https://source.unsplash.com/800x600/?aircraft%20cockpit" alt="Cockpit de aeronave" class="h-[140px] w-full rounded-[10px] border border-white/[0.03] object-cover shadow-[0_8px_20px_rgba(2,6,23,0.6)] sm:h-[170px]">
			</aside>
		</section>
	</main>

	<footer class="p-[18px] text-center text-sm text-white/60">
		© <span id="year"></span> Aviator Info — Dados e imagens para fins informativos.
	</footer>

	<script>
		document.getElementById('year').textContent = new Date().getFullYear();
	</script>
</body>
</html>
