<!doctype html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link rel="icon" href="./images/AviatorLogo.png" type="image/x-icon">
	<title>Aviator Info</title>
	<link rel="stylesheet" href="./dist/tailwind.css">
</head>
	<body class="m-0 min-h-screen bg-gradient-to-b from-slate-50 to-blue-500 pt-[74px] font-sans">
	<header class="fixed inset-x-0 top-0 z-50 flex min-h-16 items-center bg-[#438ff0] shadow-[0_1px_0_rgba(0,0,0,0.18)]" aria-label="Navegação principal">
		<a class="absolute left-[18px] top-1 flex h-14 w-[66px] items-center justify-center max-sm:left-1" href="./index.html" aria-label="Ir para a página principal">
			<img class="block h-14 w-[62px] object-contain" src="./images/AviatorLogo.png" alt="Aviator Info">
		</a>
		<nav class="flex w-full items-center justify-center gap-1 px-1 pl-[78px] sm:gap-[clamp(28px,15vw,220px)] sm:px-[100px] sm:pl-[100px]">
			<a class="border-2 border-transparent px-[5px] py-[9px] !text-[20px] font-normal leading-none text-white no-underline transition hover:text-black focus-visible:text-black focus-visible:outline-none sm:px-[18px] sm:py-2.5" href="./modelos.html">Modelos</a>
			<a class="border-2 border-transparent px-[5px] py-[9px] !text-[20px] font-normal leading-none text-white no-underline transition hover:text-black focus-visible:text-black focus-visible:outline-none sm:px-[18px] sm:py-2.5" href="./aeroportos.html">Aeroportos</a>
			<a class="border-2 border-transparent px-[5px] py-[9px] !text-[20px] font-normal leading-none text-white no-underline transition hover:text-black focus-visible:text-black focus-visible:outline-none sm:px-[18px] sm:py-2.5" href="./companhias.html">Companhias</a>
		</nav>
	</header>
	<main class="min-h-screen px-5 py-12">
		<div class="mx-auto flex max-w-[1100px] flex-col gap-14">
		<section class="grid items-center gap-7 rounded-[14px] bg-gradient-to-b from-white/[0.02] to-transparent p-7 lg:grid-cols-[1fr_520px]" aria-labelledby="home-title">
			<div>
				<h1 id="home-title" class="mb-2 text-[32px] font-bold tracking-[0.4px] text-blue-600 sm:text-5xl">Aviator Info</h1>
				<p class="mb-[18px] text-lg leading-[1.5] text-slate-900">Informações sobre modelos de aeronaves: especificações, história e curiosidades para entusiastas e profissionais da aviação.</p>
				<a class="inline-block rounded-[10px] bg-blue-600 px-4 py-2.5 font-semibold text-slate-50 transition active:scale-[.98] active:opacity-95" href="modelos.html">Explorar modelos</a>
			</div>

			<aside class="grid grid-cols-2 gap-3" aria-hidden="false">
				<img src="https://www.aircraft.airbus.com/sites/g/files/jlcbta126/files/styles/w1200h675/public/2025-10/Aircraft.Airbus%20Figma%20Images%20V2_A320neo.png?h=eb58b4d6&itok=m1AYlns4" alt="Airbus A320Neo em voo" class="col-span-2 h-[140px] w-full rounded-[10px] border border-slate-950 object-cover shadow-[0_8px_20px_rgba(2,6,23,0.6)] sm:h-[300px]">
				<img src="https://www.melhoresdestinos.com.br/wp-content/uploads/2026/05/boeing-737-max-8.jpeg" alt="Boeing 737 MAX-8 em voo" class="h-[140px] w-full rounded-[10px] border border-slate-950 object-cover shadow-[0_8px_20px_rgba(2,6,23,0.6)] sm:h-[170px]">
				<img src="https://de2y7ybiap967.cloudfront.net/images/com_hikashop/upload/thumbnails/1000x1000/img_1252.jpg" alt="Cockpit de A320" class="h-[140px] w-full rounded-[10px] border border-slate-950 object-cover shadow-[0_8px_20px_rgba(2,6,23,0.6)] sm:h-[170px]">
			</aside>
		</section>


		</div>
	</main>

	<footer class="p-[18px] text-center text-sm text-slate-700/70">
		© <span id="year"></span> Aviator Info — Dados e imagens para fins informativos.
	</footer>

	<script>
		document.getElementById('year').textContent = new Date().getFullYear();

		// Animação de entrada para a seção de modelos usando IntersectionObserver
		(function(){
			const section = document.querySelector('#models-section');
			if(!section) return;
			const obs = new IntersectionObserver((entries)=>{
				for(const e of entries){
					if(e.isIntersecting){
						section.classList.add('translate-y-0', 'opacity-100');
						obs.disconnect();
					}
				}
			},{threshold:0.18});
			obs.observe(section);
		})();
	</script>
</body>
</html>
