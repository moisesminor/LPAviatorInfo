name: Sincronizar com upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mesclar atualizações do upstream
        run: |
          git remote add upstream https://github.com/moisesminor/LPAviatorInfo.git
          git fetch upstream main
          git checkout main
          git merge --no-edit upstream/main
          git push origin main