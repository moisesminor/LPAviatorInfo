		@font-face {
			font-family: 'Plus Jakarta Sans';

		@font-face {
			font-family: 'Plus Jakarta Sans';
			font-style: normal;
			font-weight: 600;
			font-display: swap;

			font-family: 'Plus Jakarta Sans';
			font-style: normal;
			font-weight: 700;
			font-display: swap;
			src: url('./fonts/plus-jakarta-sans-700.woff2') format('woff2');
		}
		@font-face {
			font-family: 'Plus Jakarta Sans';
			font-style: normal;
			font-weight: 800;

		body.font-brand { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif; }

		.skip-link { position: absolute; left: 1rem; top: -3rem; z-index: 60; border-radius: 0.5rem; background: #102d55; padding: 0.625rem 1rem; font-weight: 600; color: #fff; transition: top 200ms ease; }
		.skip-link:focus { top: 1rem; }

		.hero-glow { position: absolute; inset: -140px -10% auto -10%; height: 460px; z-index: 0; pointer-events: none; background: radial-gradient(55% 100% at 28% 0%, rgba(67, 143, 240, 0.32), rgba(67, 143, 240, 0) 70%), radial-gradient(38% 80% at 88% 15%, rgba(18, 97, 189, 0.22), rgba(18, 97, 189, 0) 70%); }

		.country-filter-btn[aria-pressed="true"] { background: #1261bd; color: #fff; box-shadow: 0 6px 16px rgba(16, 45, 85, 0.25); }
		.country-filter-btn:not([aria-pressed="true"]):hover { background: rgba(18, 97, 189, 0.08); }

		.airport-card { position: relative; transition: box-shadow 380ms ease, transform 300ms ease; }
		.airport-card[data-open="true"] { box-shadow: 0 20px 40px rgba(16, 45, 85, 0.18); }
		.airport-card .details-icon { transform: rotate(0deg); transition: transform 320ms cubic-bezier(0.4, 0, 0.2, 1); }
		.airport-card[data-open="true"] .details-icon { transform: rotate(180deg); }
		.airport-card .details-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 420ms cubic-bezier(0.4, 0, 0.2, 1); }
		.airport-card[data-open="true"] .details-wrap { grid-template-rows: 1fr; }
		.airport-card .details-inner { overflow: hidden; min-height: 0; }
		.airport-card .details-content { border-top-color: transparent; opacity: 0; transform: translateY(-8px) scale(0.98); transition: opacity 280ms ease, transform 280ms cubic-bezier(0.34, 1.56, 0.64, 1), border-top-color 320ms ease; transform-origin: top center; }
		.airport-card[data-open="true"] .details-content { border-top-color: rgb(226 232 240); opacity: 1; transform: translateY(0) scale(1); transition-delay: 150ms; }

		.skeleton-card { border-radius: 1rem; border: 1px solid rgba(15, 23, 42, 0.08); background: #fff; overflow: hidden; }
		.skeleton-shine { position: relative; overflow: hidden; background: #e6ecf5; }
		.skeleton-shine::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent); animation: skeleton-sweep 1.6s ease-in-out infinite; }
		@keyframes skeleton-sweep { 100% { transform: translateX(100%); } }

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
		}
	</style>
</head>

	<main id="main-content" class="mx-auto w-[min(1100px,calc(100%-40px))] px-0 py-[52px] pb-20">
		<section class="relative overflow-hidden rounded-2xl">
			<div class="hero-glow" aria-hidden="true"></div>
			<div class="relative z-10">
				<div class="country-filter mb-4 inline-flex items-center gap-1 rounded-full border border-slate-900/10 bg-white/70 p-1 shadow-sm backdrop-blur-sm" role="group" aria-label="Filtrar aeroportos por país">
					<button type="button" class="country-filter-btn rounded-full px-4 py-2 text-sm font-semibold text-[#1261bd] transition" data-country="brasil" aria-pressed="true">🇧🇷 Brasil</button>
					<button type="button" class="country-filter-btn rounded-full px-4 py-2 text-sm font-semibold text-[#1261bd] transition" data-country="usa" aria-pressed="false">🇺🇸 Estados Unidos</button>
				</div>
				<h1 id="page-title" class="mb-3 text-[clamp(2rem,5vw,3.5rem)] font-extrabold tracking-tight text-[#102d55]">Aeroportos do Brasil</h1>
				<p id="page-subtitle" class="max-w-[62ch] text-lg leading-[1.6] text-[#18283b]">Códigos IATA e ICAO, localização, pistas e mapa de cada aeroporto brasileiro — dados atualizados para consulta rápida.</p>
				<p id="airport-count" class="mt-3 text-sm font-medium text-[#1261bd]" aria-live="polite"></p>
			</div>
		</section>

		<section class="mt-8 max-w-md" aria-label="Pesquisar aeroporto por cidade">
			<label for="airport-search" class="sr-only">Pesquisar por cidade</label>
			<div class="relative">
				<svg class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M14 14L18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
				<input type="search" id="airport-search" placeholder="Pesquisar por cidade..." autocomplete="off" class="w-full rounded-xl border border-slate-900/10 bg-white py-3 pl-11 pr-4 text-base text-[#102d55] shadow-[0_8px_24px_rgba(16,45,85,0.08)] placeholder:text-slate-400 focus:border-[#1261bd] focus:outline-none focus:ring-2 focus:ring-[#1261bd]/30">
			</div>
		</section>

		<section class="mt-8 grid items-start gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-label="Lista de aeroportos brasileiros" id="airport-grid">

				<div class="skeleton-shine h-48 w-full"></div>
				<div class="space-y-3 p-6">
