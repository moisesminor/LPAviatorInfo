<!doctype html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link rel="icon" href="./images/AviatorIcon.ico" type="image/x-icon">
	<title>Modelos | Aviator Info</title>
	<link rel="stylesheet" href="./dist/tailwind.css">
</head>
	<body class="m-0 min-h-screen bg-gradient-to-b from-slate-50 to-blue-500 pt-16 font-sans">
	<header class="fixed inset-x-0 top-0 z-50 flex min-h-16 items-center bg-[#438ff0] shadow-[0_1px_0_rgba(0,0,0,0.18)]" aria-label="Navegação principal">
		<a class="absolute left-[18px] top-1 flex h-14 w-[66px] items-center justify-center max-sm:left-1" href="./index.html" aria-label="Ir para a página principal"><img class="block h-14 w-[62px] object-contain" src="./images/AviatorLogo.png" alt="Aviator Info"></a>
		<nav class="flex w-full items-center justify-center gap-1 px-1 pl-[78px] sm:gap-[clamp(28px,15vw,220px)] sm:px-[100px] sm:pl-[100px]">
			<a class="border-2 border-transparent px-[5px] py-[9px] !text-[20px] font-normal leading-none text-black no-underline transition sm:px-[18px] sm:py-2.5" href="./modelos.html" aria-current="page">Modelos</a>
			<a class="border-2 border-transparent px-[5px] py-[9px] !text-[20px] font-normal leading-none text-white no-underline transition hover:text-black focus-visible:text-black focus-visible:outline-none sm:px-[18px] sm:py-2.5" href="./aeroportos.html">Aeroportos</a>
			<a class="border-2 border-transparent px-[5px] py-[9px] !text-[20px] font-normal leading-none text-white no-underline transition hover:text-black focus-visible:text-black focus-visible:outline-none sm:px-[18px] sm:py-2.5" href="./companhias.html">Companhias</a>
		</nav>
	</header>
	<main class="mx-auto w-[min(1100px,calc(100%-40px))] px-0 py-[52px] pb-20">
		<h1 class="mb-3 text-[clamp(2rem,5vw,3.5rem)] font-bold text-[#102d55]">Modelos</h1>
		<p class="max-w-[700px] text-lg leading-[1.6] text-[#18283b]">Explore informações sobre aeronaves comerciais, suas especificações e a história de cada modelo.</p>
		<section aria-labelledby="aircraft-title" class="mt-[34px]" id="models-section">
			<div class="mb-6">
				<p class="mb-1 text-sm font-semibold uppercase tracking-[2px] text-[#102d55]/70">Explore a frota</p>
				<h2 id="aircraft-title" class="text-3xl font-bold text-[#102d55] sm:text-4xl">Modelos em destaque</h2>
			</div>
			<div class="grid gap-5 md:grid-cols-3">
				<a href="aircraft/airbus-a320neo.html" class="group overflow-hidden rounded-[10px] bg-white/[0.92] text-slate-900 shadow-[0_8px_20px_rgba(2,6,23,0.2)] transition hover:-translate-y-1 hover:shadow-[0_14px_28px_rgba(2,6,23,0.25)]" aria-label="Ver informações do Airbus A320neo">
					<img src="https://www.aircraft.airbus.com/sites/g/files/jlcbta126/files/styles/w1200h675/public/2025-10/Aircraft.Airbus%20Figma%20Images%20V2_A320neo.png?h=eb58b4d6&itok=m1AYlns4" alt="Airbus A320neo em voo" class="h-44 w-full object-cover transition duration-300 group-hover:scale-105">
					<span class="block px-5 py-4 text-lg font-bold">Airbus A320neo</span>
				</a>
				<a href="aircraft/boeing-737-max-8.html" class="group overflow-hidden rounded-[10px] bg-white/[0.92] text-slate-900 shadow-[0_8px_20px_rgba(2,6,23,0.2)] transition hover:-translate-y-1 hover:shadow-[0_14px_28px_rgba(2,6,23,0.25)]" aria-label="Ver informações do Boeing 737 MAX 8">
					<img src="https://www.melhoresdestinos.com.br/wp-content/uploads/2026/05/boeing-737-max-8.jpeg" alt="Boeing 737 MAX 8 em voo" class="h-44 w-full object-cover transition duration-300 group-hover:scale-105">
					<span class="block px-5 py-4 text-lg font-bold">Boeing 737 MAX 8</span>
				</a>
				<a href="aircraft/airbus-a350.html" class="group overflow-hidden rounded-[10px] bg-white/[0.92] text-slate-900 shadow-[0_8px_20px_rgba(2,6,23,0.2)] transition hover:-translate-y-1 hover:shadow-[0_14px_28px_rgba(2,6,23,0.25)]" aria-label="Ver informações do Airbus A350">
					<img src="https://www.aircraft.airbus.com/sites/g/files/jlcbta126/files/styles/w1200h675/public/2025-10/Aircraft.Airbus%20Figma%20Images%20V2_A320neo.png?h=eb58b4d6&itok=m1AYlns4" alt="Airbus A350 em voo" class="h-44 w-full object-cover transition duration-300 group-hover:scale-105">
					<span class="block px-5 py-4 text-lg font-bold">Airbus A350</span>
				</a>
			</div>
		</section>
	</main>
</body>
</html>
